name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore TeamTracker.Tests/TeamTracker.Tests.csproj

      - name: Build
        run: dotnet build TeamTracker.Tests/TeamTracker.Tests.csproj -c Release --no-restore

      - name: Test
        run: dotnet test TeamTracker.Tests/TeamTracker.Tests.csproj -c Release --no-build --logger "console;verbosity=normal"

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t teamtracker .
